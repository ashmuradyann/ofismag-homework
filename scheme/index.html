<!DOCTYPE html>
<html lang="ru">
  
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Схема - LeaderLine</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
  
  <h2 style="font-weight: 300; margin-bottom: 40px;">Масоны Самсона</h2>
  
  <div class="canvas">
    <div id="n1" class="node" style="grid-area: 1 / 1;">Алликсаар</div>
    <div id="n12" class="node" style="grid-area: 10 / 2; margin-left: -210px;">Игорь Зверёк</div>
    <div id="n13" class="node" style="grid-area: 11 / 2; margin-left: -210px;">Антон Строй</div>
    <div id="n4" class="node" style="grid-area: 4 / 1; margin-left: 150px;">Станислав<br>Клитотехнис</div>
    <div id="n6" class="node" style="grid-area: 5 / 2;">Людмила<br>Водолазская</div>
    <div id="n7" class="node" style="grid-area: 6 / 2;">Ольга Боргдорф</div>
    <div id="n11" class="node" style="grid-area: 8 / 2;">Сергей Брус</div>
    <div id="n2" class="node" style="grid-area: 1 / 3;">Ду Хаст<br>Вячеславович</div>
    <div id="n3" class="node" style="grid-area: 2 / 3; margin-top: 20px;">Анастасия Ширинкина</div>
    <div id="n5" class="node" style="grid-area: 4 / 3;">Александр Троян</div>
    <div id="n8" class="node" style="grid-area: 6 / 3;">Дмитрий Возигнуй</div>
    <div id="n9" class="node" style="grid-area: 7 / 3; margin-top: 20px;">Кристина Болтушкина</div>
    <div id="n10" class="node" style="grid-area: 8 / 3; margin-top: 40px;">Максим Висюлькин</div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/leader-line-new/leader-line.min.js"></script>
  <script src="./assets/js/script.js"></script>
</body>

</html>
