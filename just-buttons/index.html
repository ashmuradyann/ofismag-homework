<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assets/css/style.css">
  <title>Кнопки</title>
</head>

<body>
  <div class="buttons-wrapper">
    <div>
      <button class="button btn-default">Просмотреть</button>
      <button class="button btn-default">Просмотреть</button>
      <button class="button btn-default">Просмотреть</button>
      <button class="button btn-default" disabled>Просмотреть</button>
    </div>
    <div>
      <button class="button btn-red-outline">Просмотреть</button>
      <button class="button btn-red-outline">Просмотреть</button>
      <button class="button btn-red-outline">Просмотреть</button>
      <button class="button btn-red-outline" disabled>Просмотреть</button>
    </div>
    <div>
      <button class="button btn-red">Просмотреть</button>
      <button class="button btn-red">Просмотреть</button>
      <button class="button btn-red">Просмотреть</button>
      <button class="button btn-red" disabled>Просмотреть</button>
    </div>
    <div>
      <button class="button btn-arrow">Просмотреть<span>🞂</span></button>
      <button class="button btn-arrow">Просмотреть<span>🞂</span></button>
      <button class="button btn-arrow">Просмотреть<span>🞂</span></button>
      <button class="button btn-arrow" disabled>Просмотреть<span>🞂</span></button>
    </div>
    <div>
      <button class="button btn-green">Просмотреть</button>
      <button class="button btn-green">Просмотреть</button>
      <button class="button btn-green">Просмотреть</button>
      <button class="button btn-green" disabled>Просмотреть</button>
    </div>
    <div>
      <button class="button btn-green-outline">Просмотреть</button>
      <button class="button btn-green-outline">Просмотреть</button>
      <button class="button btn-green-outline">Просмотреть</button>
      <button class="button btn-green-outline" disabled>Просмотреть</button>
    </div>
  </div>
  <div class="icon-buttons">
    <button class="button btn-default icon-button"><img src="./assets/icons/edit.svg" alt="">Редактировать</button>
    <button class="button btn-default icon-button"><img src="./assets/icons/upload.svg" alt="">Выгрузить в
      Excel</button>
    <button class="button btn-default icon-button"><img src="./assets/icons/delete.svg" alt="">Удалить список</button>
    <button class="button btn-default icon-button"><img src="./assets/icons/print.svg" alt="">Распечатать</button>
    <button class="button btn-default icon-button"><img src="./assets/icons/download.svg" alt="">Загрузить из
      файла</button>
  </div>
</body>

</html>
