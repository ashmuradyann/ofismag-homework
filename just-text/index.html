<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Произвольный текст</title>
</head>

<body>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-size: 28px;
      padding: 16px;
      background: linear-gradient(to bottom, rgba(128, 128, 128, 0.438), white) no-repeat;
    }

    .shadow-text {
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.534);
      display: inline;
    }

    .gradient-text {
      background: linear-gradient(to bottom, white, blue, red) no-repeat;
      color: transparent;
      background-clip: text;
    }

    .contur-text {
      color: white;
      -webkit-text-stroke: 1px black;
    }

    .blur-text {
      color: transparent;
      text-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
    }

    .animated-gradient-text {
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      color: #fff;
      padding: 5px 10px;
      border-radius: 5px;
      width: fit-content;
      margin-top: 5px;
    }

    .typing-text {
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid transparent;
      animation: typing 5s steps(150), infinite 5s alternate;
      width: 100%;
      color: rgb(209, 77, 77);
      font-weight: 700;
      margin-top: 5px;
    }

    @keyframes typing {
      from {
        width: 0
      }

      to {
        width: 100%
      }
    }

    @keyframes gradient {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    mark {
      background-color: rgb(143, 51, 51);
      color: white;
    }
  </style>

  <div class="text-block">
    <p class="shadow-text">Lorem</p> <i>ipsum</i> <b>dolor</b> <strong>sit</strong> <mark>amet</mark>
    <small>consectetur</small> <del>adipisicing</del> <ins>elit.</ins> H<sub>2</sub>O 2<sup>2<small>+2</small></sup>
    </br>
    <p class="gradient-text">quis veritatis labore blanditiis</p>
    <p class="contur-text">ducimus facere quasi dolores quos? </p>
    <p class="blur-text">Dolorum omnisaspernatur quo consequatur.</p>
    <p class="animated-gradient-text">hic recusandae nam odit quasi cupiditate.</p>
    <p class="typing-text">Lorem ipsum dolor sit amet conseum.</p>
  </div>
</body>

</html>
